services:
  - type: web
    name: tymotors-backend-staging
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/tisnooh/tymotors-backend
    branch: develop
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: test
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: SITE_URL
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: PUBLIC_TEST_CHECKOUT_ENABLED
        value: "false"
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: FREE_SHIPPING_THRESHOLD_CENTS
        value: "35000"
      - key: SHIPPING_RATE_CENTS
        value: "1500"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM_NAME
        value: TYMotors
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_TOKEN_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
